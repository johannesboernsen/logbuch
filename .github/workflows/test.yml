name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: find app public tools -name '*.php' -print0 | xargs -0 -n1 php -l

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag logbuch:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: logbuch:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
