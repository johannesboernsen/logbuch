name: Release candidate

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: find app public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Version prüfen
        run: test "v$(tr -d '\n' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Tag-Kandidat sichern
        run: node -e 'require("fs").writeFileSync("release-candidate.json", JSON.stringify({tag:process.env.GITHUB_REF_NAME, commit:process.env.GITHUB_SHA}) + "\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: logbuch-tag-candidate
          path: release-candidate.json
          if-no-files-found: error
