name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: find app public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Version prüfen
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          test "v$(tr -d '\n' < VERSION)" = "$GITHUB_REF_NAME"
          test -n "$UPDATE_SIGNING_PRIVATE_KEY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Image-Metadaten
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "updater_image=${image}-updater" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: app_image
        name: Logbuch-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:stable
      - id: updater_image
        name: AIO-Updater-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/updater/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.updater_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.updater_image }}:stable
      - name: Release-Paket bauen und signieren
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          LOGBUCH_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node tools/build-release.mjs \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image }}" \
            "${{ steps.app_image.outputs.digest }}" \
            "${{ steps.meta.outputs.updater_image }}" \
            "${{ steps.updater_image.outputs.digest }}"
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/update-private.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-private.pem" -out "$RUNNER_TEMP/update-manifest.sig.bin" dist/update-manifest.json
          base64 -w0 "$RUNNER_TEMP/update-manifest.sig.bin" > dist/update-manifest.sig
      - name: Signierte Release-Dateien sichern
        uses: actions/upload-artifact@v4
        with:
          name: logbuch-release-${{ steps.meta.outputs.version }}
          path: |
            dist/logbuch-web-${{ steps.meta.outputs.version }}.tar
            dist/update-manifest.json
            dist/update-manifest.sig
            dist/release-notes.md
            dist/checksums.txt
          if-no-files-found: error
      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Logbuch ${{ steps.meta.outputs.version }}" \
            --notes-file dist/release-notes.md \
            "dist/logbuch-web-${{ steps.meta.outputs.version }}.tar" \
            dist/update-manifest.json dist/update-manifest.sig dist/checksums.txt
