name: logbuch

services:
  logbuch:
    image: ${LOGBUCH_IMAGE:-ghcr.io/johannesboernsen/logbuch:stable}
    container_name: logbuch
    restart: unless-stopped
    ports:
      - "${LOGBUCH_BIND_ADDRESS:-0.0.0.0}:${LOGBUCH_PORT:-8080}:80"
    volumes:
      - logbuch-data:/var/www/html/storage
    environment:
      TZ: ${LOGBUCH_TIMEZONE:-Europe/Berlin}
      LOGBUCH_PLATFORM: docker

  logbuch-updater:
    image: ${LOGBUCH_UPDATER_IMAGE:-ghcr.io/johannesboernsen/logbuch-updater:stable}
    container_name: logbuch-updater
    restart: unless-stopped
    depends_on:
      logbuch:
        condition: service_healthy
    volumes:
      - logbuch-data:/var/lib/logbuch
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${LOGBUCH_TIMEZONE:-Europe/Berlin}
      LOGBUCH_BIND_ADDRESS: ${LOGBUCH_BIND_ADDRESS:-0.0.0.0}
      LOGBUCH_PORT: ${LOGBUCH_PORT:-8080}
      LOGBUCH_TIMEZONE: ${LOGBUCH_TIMEZONE:-Europe/Berlin}
      LOGBUCH_UPDATE_IMAGE: ${LOGBUCH_UPDATE_IMAGE:-ghcr.io/johannesboernsen/logbuch}
      LOGBUCH_UPDATE_UPDATER_IMAGE: ${LOGBUCH_UPDATE_UPDATER_IMAGE:-ghcr.io/johannesboernsen/logbuch-updater}
      LOGBUCH_UPDATE_POLL_SECONDS: ${LOGBUCH_UPDATE_POLL_SECONDS:-5}

volumes:
  logbuch-data:
    name: logbuch-data
