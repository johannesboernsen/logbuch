services:
  makelog:
    image: ${MAKELOG_IMAGE:-makelog:local}
    build: .
    container_name: makelog
    restart: unless-stopped
    ports:
      - "${MAKELOG_BIND_ADDRESS:-0.0.0.0}:${MAKELOG_PORT:-8080}:80"
    volumes:
      - ./makelog-data:/var/www/html/storage
    environment:
      TZ: ${MAKELOG_TIMEZONE:-Europe/Berlin}
      MAKELOG_PLATFORM: docker
