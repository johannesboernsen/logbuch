name: logbuch

services:
  logbuch:
    image: ${LOGBUCH_IMAGE}
    container_name: logbuch
    restart: unless-stopped
    ports:
      - "${LOGBUCH_BIND_ADDRESS}:${LOGBUCH_PORT}:80"
    volumes:
      - logbuch-data:/var/www/html/storage
    environment:
      TZ: ${LOGBUCH_TIMEZONE}
      LOGBUCH_PLATFORM: docker

  logbuch-updater:
    image: ${LOGBUCH_UPDATER_IMAGE}
    container_name: logbuch-updater
    restart: unless-stopped
    volumes:
      - logbuch-data:/var/lib/logbuch
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${LOGBUCH_TIMEZONE}
      LOGBUCH_BIND_ADDRESS: ${LOGBUCH_BIND_ADDRESS}
      LOGBUCH_PORT: ${LOGBUCH_PORT}
      LOGBUCH_TIMEZONE: ${LOGBUCH_TIMEZONE}
      LOGBUCH_UPDATE_IMAGE: ${LOGBUCH_UPDATE_IMAGE}
      LOGBUCH_UPDATE_UPDATER_IMAGE: ${LOGBUCH_UPDATE_UPDATER_IMAGE}
      LOGBUCH_UPDATE_POLL_SECONDS: ${LOGBUCH_UPDATE_POLL_SECONDS}

volumes:
  logbuch-data:
    external: true
    name: logbuch-data
